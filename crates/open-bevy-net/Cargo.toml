[package]
name = "open-bevy-net"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
description = "Native and wasm WebRTC transport shared by Open Bevy games."

[dependencies]
ehttp = { version = "0.7.1", features = ["json", "native-async"] }
lz4_flex = { version = "0.14.0", default-features = false, features = ["std"] }
matchbox_socket = "0.14.0"
open-bevy-protocol = { path = "../open-bevy-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "2.5.8"

[dev-dependencies]
axum = "0.8.9"
open-bevy-signaling = { path = "../../services/open-bevy-signaling" }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }
