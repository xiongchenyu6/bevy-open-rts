<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bevy Open RTS</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="bevy-canvas"></canvas>
    <div id="unsupported" hidden>
      WebGPU is unavailable in this browser. Use a current desktop browser with
      WebGPU enabled.
    </div>
    <script type="module">
      const buildId = "445eefb5f0289fa1";
      const unsupported = document.getElementById("unsupported");
      const adapter =
        "gpu" in navigator ? await navigator.gpu.requestAdapter() : null;

      if (!adapter) {
        unsupported.hidden = false;
      } else {
        const { default: init } = await import(
          `./pkg/bevy_open_rts.js?v=${buildId}`
        );
        await init({
          module_or_path: `./pkg/bevy_open_rts_bg.wasm?v=${buildId}`,
        });
      }
    </script>
  </body>
</html>
