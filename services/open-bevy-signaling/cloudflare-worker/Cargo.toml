[package]
name = "open-bevy-signaling"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
description = "Cloudflare Worker deployment target for the universal Open Bevy signaling service."

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
matchbox_protocol = { version = "0.14.0", features = ["json"] }
open-bevy-protocol = { path = "../../../crates/open-bevy-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23", features = ["js", "serde", "v4"] }
worker = "0.8.4"

[workspace]
