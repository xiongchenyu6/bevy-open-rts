name = "open-bevy-signaling"
main = "build/worker/shim.mjs"
compatibility_date = "2026-07-25"
account_id = "2764ae0fd9a5cb92c9ac67708620e54c"
workers_dev = true
preview_urls = false

[build]
command = "bash scripts/build.sh"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "GameRoom" },
  { name = "DIRECTORY", class_name = "RoomDirectory" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "RoomDirectory"]

[vars]
PUBLIC_BASE_URL = "https://open-bevy-signaling.xiongchenyu6.workers.dev"
ALLOWED_ORIGINS = "https://xiongchenyu6.github.io,http://127.0.0.1:8080,http://localhost:8080"
ROOM_TTL_MS = "900000"
HOST_RECONNECT_GRACE_MS = "30000"
TURN_CREDENTIAL_TTL_SECONDS = "3600"
LEGACY_TURN_URLS = "turn:101.78.126.6:3478?transport=udp,turn:101.78.126.6:3478?transport=tcp"
