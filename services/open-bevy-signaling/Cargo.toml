[package]
name = "open-bevy-signaling"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
description = "Universal Matchbox-compatible WebRTC signaling service for Open Bevy games."

[dependencies]
axum = { version = "0.8.9", features = ["json", "macros", "ws"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = "0.3.34"
matchbox_protocol = { version = "0.14.0", features = ["json"] }
open-bevy-protocol = { path = "../../crates/open-bevy-protocol" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"
