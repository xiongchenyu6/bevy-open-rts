[package]
name = "bevy-open-rts"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
description = "A Bevy 0.19/WebGPU porting foundation for godot-open-rts."
default-run = "bevy-open-rts"

[features]
default = ["audio"]
# wav for the UI/sfx samples, vorbis for the .ogg unit/announcer voice lines —
# without vorbis the .ogg voices fail to decode and acknowledgments stay silent.
audio = ["bevy/audio", "bevy/wav", "bevy/vorbis"]
webgpu = ["bevy/web", "bevy/webgpu", "bevy/web_asset_cache"]

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
  "default_app",
  "bevy_winit",
  "wayland",
  "3d_bevy_render",
  "ui_bevy_render",
  "scene",
  "picking",
  "bevy_ui_widgets",
  "custom_cursor",
  "keyboard",
  "mouse",
  "png",
] }
bevy_asset_loader = { version = "0.27.0", default-features = false }
bevy_cursor_kit = { version = "0.9.0", default-features = false, features = ["serde_ron_asset"] }
bevy_fluent = "0.15.0"
bevy_common_assets = { version = "0.17.0", default-features = false, features = [
  "json",
  "ron",
] }
bevy_rts_camera = "0.14"
iyes_progress = { version = "0.17.0", default-features = false, features = ["assets"] }
moonshine-kind = "0.5.1"
# Bevy's text stack reaches ICU4X through Parley. In debug builds, icu_provider
# writes missing complex-segmentation warnings directly to stderr unless its
# logging feature is enabled; enabling it lets Bevy's LogPlugin filter them.
icu_provider = { version = "2.2.0", default-features = false, features = ["logging"] }
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
# NOTE: no `strip = true` — it removes the wasm `target_features` section, after
# which wasm-opt rejects the bulk-memory ops. wasm-opt -Oz already strips the
# wasm, so strip's marginal (~0.1 MB) gain isn't worth breaking the web build.

[profile.dev.package."*"]
opt-level = 2
