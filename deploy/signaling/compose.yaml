services:
  signaling:
    build:
      context: ../..
      dockerfile: services/open-bevy-signaling/Dockerfile
    restart: unless-stopped
    environment:
      OPEN_BEVY_BIND: 0.0.0.0:3536
      OPEN_BEVY_PUBLIC_WS_BASE: wss://${SIGNALING_HOST:?set SIGNALING_HOST}
      OPEN_BEVY_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      OPEN_BEVY_HOST_RECONNECT_GRACE_SECS: ${HOST_RECONNECT_GRACE_SECS:-30}
      OPEN_BEVY_ICE_SERVERS_JSON: >-
        [{"urls":["stun:stun.cloudflare.com:3478"]}]
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:?set CLOUDFLARE_TURN_KEY_ID}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:?set CLOUDFLARE_TURN_API_TOKEN}
      TURN_CREDENTIAL_TTL_SECONDS: 3600
      RUST_LOG: open_bevy_signaling=info
    dns:
      - ${CONTAINER_DNS_PRIMARY:-1.1.1.1}
      - ${CONTAINER_DNS_SECONDARY:-1.0.0.1}
    expose:
      - "3536"
    ports:
      # A host-managed TLS proxy can reach the service without exposing plain
      # HTTP to the internet. The bundled Caddy still uses the Docker network.
      - "127.0.0.1:${SIGNALING_BIND_PORT:-3536}:3536"
    networks:
      - edge

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SIGNALING_HOST: ${SIGNALING_HOST:?set SIGNALING_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - signaling
    networks:
      - edge

networks:
  edge:
    name: open_bevy_signaling_edge
    # Podman otherwise replaces service-level resolvers with its embedded
    # Aardvark address. Docker Compose safely ignores this extension.
    x-podman.disable_dns: true

volumes:
  caddy_data:
  caddy_config:
